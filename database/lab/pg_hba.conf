# Dedicated SQL Lab cluster only. A restricted login can connect only to its same-named database.
local all meridian_lab_admin scram-sha-256
host all meridian_lab_admin 127.0.0.1/32 scram-sha-256
# Docker forwards local host connections from its bridge network.
host all meridian_lab_admin 0.0.0.0/0 scram-sha-256
host sameuser all 0.0.0.0/0 scram-sha-256
host all all 0.0.0.0/0 reject
host all all ::0/0 reject
