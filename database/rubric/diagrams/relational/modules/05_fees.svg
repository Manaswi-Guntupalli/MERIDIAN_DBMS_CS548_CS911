_fkey" d="M 273 591 V 575 H 125 V 466 H 210.5 V 482" fill="none" stroke="#65A30D" stroke-width="1.35" stroke-linejoin="round" marker-end="url(#arrow_Fee)"><title>Payment.feeId -&gt; Fee.id</title></path><rect id="cell_School_id" x="180" y="264.5" width="61" height="34" fill="#F1F4F7" stroke="#1D2D3D" stroke-width="1"/><text x="210.5" y="286.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172734" text-decoration="underline" font-weight="700">id</text><text x="259" y="287.5" font-family="Arial,sans-serif" font-size="19" fill="#172734" font-weight="700">School [external]</text><text x="180" y="319.5" font-family="Arial,sans-serif" font-size="12" fill="#536577">External reference: primary key only</text><rect id="cell_Student_id" x="180" y="371" width="61" height="34" fill="#F1F4F7" stroke="#1D2D3D" stroke-width="1"/><text x="210.5" y="393" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172734" text-decoration="underline" font-weight="700">id</text><text x="259" y="394" font-family="Arial,sans-serif" font-size="19" fill="#172734" font-weight="700">Student [external]</text><text x="180" y="426" font-family="Arial,sans-serif" font-size="12" fill="#536577">External reference: primary key only</text><rect id="cell_Fee_id" x="180" y="483" width="61" height="34" fill="#FFFFFF" stroke="#1D2D3D" stroke-width="1"/><text x="210.5" y="505" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#172734" text-decoration="underline" font-weight="700">id</text><rect id="cell_Fee_schoolId" x="241" y="483" width="88" height="34" fill="#FFFFFF" stroke="#1D2D3D" stroke-width="1"/><text x="285" y="505" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#2563EB" font-style="italic">schoolId</text><rect id="cell_Fee_studentId" x="329" y="483" width="94" height="34" fill="#FFFFFF" stroke="#1D2D3D" stroke-width="1"/><text x="376" y="505" text-anchor="middle" font-family="Arial,sans-serif" font-size=