name: DBMS verification
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: ci-disposable-password
          POSTGRES_DB: meridian_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meridian -d meridian_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://meridian:ci-disposable-password@localhost:5432/meridian_dev?schema=public
      TEST_DATABASE_URL: postgresql://meridian:ci-disposable-password@localhost:5432/meridian_test?schema=public
      JWT_SECRET: ci-disposable-secret-not-for-production-1234567890
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix server run db:generate
      - run: npm run build
      - run: npm --prefix server run test
      - run: npm run db:verify
        env:
          DATABASE_URL: postgresql://meridian:ci-disposable-password@localhost:5432/meridian_test?schema=public
      - run: npx tsx scripts/verify-embeddings.ts
        working-directory: server
